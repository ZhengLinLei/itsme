services:
  itsme-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: full
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        OLLAMA_VERSION: ${OLLAMA_VERSION:-latest}
        PRELOAD_MODEL: ${PRELOAD_MODEL:-}
    image: ${IMAGE_NAME:-itsme-api}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-itsme-api}
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      API_KEY: ${API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      MAX_HISTORY: ${MAX_HISTORY:-20}
      MAX_MESSAGES_PER_SESSION: ${MAX_MESSAGES_PER_SESSION:-200}
      MAX_SESSIONS: ${MAX_SESSIONS:-10000}
      RATE_LIMIT_MESSAGES_PER_MIN: ${RATE_LIMIT_MESSAGES_PER_MIN:-12}
      RATE_LIMIT_REQUESTS_PER_MIN: ${RATE_LIMIT_REQUESTS_PER_MIN:-60}
      RATE_LIMIT_SESSIONS_PER_HOUR: ${RATE_LIMIT_SESSIONS_PER_HOUR:-20}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-2000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-16384}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
      LLM_QUEUE: ${LLM_QUEUE:-20}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-5}
      WS_IDLE_TIMEOUT_SEC: ${WS_IDLE_TIMEOUT_SEC:-300}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
    ports:
      - '${HOST_PORT:-3000}:${PORT:-3000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../context:/app/context:ro
      - itsme-models:/root/.ollama
      - itsme-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512

volumes:
  itsme-models:
  itsme-data:
